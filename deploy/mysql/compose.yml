# FOREMAN 전용 MySQL (README 3.12) — 호스트 도커, 127.0.0.1:3308
#   띄우기: docker compose -f deploy/mysql/compose.yml up -d
# 비밀값은 저장소 맨 위 .env.db(600, 커밋 안 함). 견본은 .env.db.example
# 데이터는 bind mount라 docker volume prune 에 지워지지 않는다. 백업은 backup.sh(사용자 crontab)
name: foreman

services:
  foreman-mysql:
    image: mysql:8.0.46
    container_name: foreman-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3308:3306"
    env_file: ../../.env.db
    volumes:
      - ${HOME}/volumes/foreman-mysql:/var/lib/mysql
      - ./my.cnf:/etc/mysql/conf.d/foreman.cnf:ro
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
