# 서기 말풍선 기준(11-15 포스트잇, bridge/postit.py conf, nudge_of). 자동은 말풍선까지만. 세션은 사람이 [시키기]를 눌러야 붙는다.
#
# [postit] 열린 포스트잇이 쌓이면 서기 자리에 「포스트잇 쌓임」 말풍선, 포스트잇 단추 주황. 21시 묶음 보고에는 넣지 않는다.
#   open_max:     열린 포스트잇이 이만큼 이상이면
#   stale_days:   가장 오래된 것이 이만큼(일) 지났으면
#   refresh_days: 마지막 [갱신] 뒤(한 번도 안 했으면 가장 오래된 것부터) 이만큼(일) 지났으면
#   셋 중 하나면 띄운다. 값이 없거나 0 이상 정수가 아니면 코드 기본값(20, 7, 7)으로 돌고 브리지 로그에 경고가 남는다.
#   모르는 칸 이름도 경고한다(조용히 무시하지 않게, 11-17 옛 [nudge]가 그렇게 묻혀 있었다).
# 브리지가 서기실을 읽을 때마다 이 파일을 다시 읽는다(다시 띄우지 않아도 다음 읽기부터 반영).

[postit]
open_max = 20
stale_days = 7
refresh_days = 7
