# 프로젝트별 관리자(11-11, bridge/managers.py) — 주소(GET /api/managers) · 관리자끼리 부탁(POST /api/managers/<프로젝트>/ask).
# 관리자 = 그 프로젝트 원본 폴더에서 살아 있는 역할 manager 세션. 없거나 못 넣으면 텔레그램 한 번 + 응답에 사유.
# 바꾸면 브리지를 다시 띄운다. 끄기 = enabled = false(목록은 그대로 읽히고 부탁만 503)
#
# 다른 저장소에 관리자를 실제로 띄우는 것은 그 저장소 CLAUDE.md 규칙 줄과 함께 사용자가 시킬 때 —
# 초안은 log/coder_c_wave2_20261111.md 「다른 저장소 관리자 — CLAUDE.md 초안」

[managers]
enabled = true     # 11-11 사용자 지시로 켬(관리자 띄우기는 따로 — 첫째는 ronanlab-infra)
projects = []     # 비면 DB의 모든 프로젝트(project.repo_path가 있는 것)

# 교장 계획 카드 [관리자에게 보내기](bridge/handover.py) — 고친 계획을 저장하고 그 프로젝트 관리자 입력 칸에 넣는다.
# 관리자는 POST /api/foreman/start {"dispatch_id": N, "use_saved": true}로 띄운다(교장 [시작]과 같은 기록).
# 관리자가 없거나 못 넣으면 카드에 사유 + 텔레그램. 넘긴 뒤 wait_min분 안에 시작하지 않으면 텔레그램 한 번.
# 끄기 = enabled = false + 브리지 다시 띄우기(카드 단추가 사라지고 [이대로 시작]은 그대로)
[handover]
enabled = true     # 11-11 사용자 지시로 켬
wait_min = 15
every_s = 60
