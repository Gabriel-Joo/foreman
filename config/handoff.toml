# 세션 생명주기(11-11 1물결 A, log/plan_structure_20261111.md 「1물결 — A」) — bridge/mergeprep.py
#
# [merge_prep] — worktree 세션이 「일을 마침」이 되면 브리지가 기계로(LLM 아님) merge-tree를 돌려 합치기 승인 카드를 만든다.
#   일을 마침 = (살아 있고, 일하지 않고(IDLE, 열린 턴과 뒤에서 도는 일 없음), 권한 거부로 멈추지 않음) 또는 세션이 끝남.
#               그리고 worktree에 합칠 커밋이 있고(ahead > 0) 커밋 안 한 변경이 0. 마지막 응답이 묻는 말이어도 마친 것으로 보고
#               카드에 「세션이 묻는 말이 있습니다」를 함께 싣는다(bridge/mergeprep.py 머리)
#   카드: 브랜치 · 커밋 · 바뀐 파일 · 충돌 여부 · ff 가능 / main이 앞섬 · docs 정리 후보
#   사람이 [합치기]: 충돌 없고 깨끗하면 살아 있는 세션도 끝내고 합친다(main이 앞섰으면 rebase). 충돌이면 끝내지 않고 그 세션에
#   「main을 가져와 풀라」를 보낸다(끝난 세션이면 관리자 세션에). 결과는 관리자 세션에 남긴다.
# 1단계(지금)는 합치기까지 — 시험 · push · 브리지 다시 띄우기 · 화면 점검은 관리자가 한다.
# 바꾸면 브리지를 다시 띄운다. 끄기 = enabled = false + 브리지 다시 띄우기(카드만 사라지고 패널 [합치기] · API 합치기는 그대로)

[merge_prep]
enabled = true           # 11-11 사용자 지시로 켬(시험 세션으로 확인). 끄기 = false + 브리지 다시 띄우기
every_s = 60             # 몇 초마다 훑나
stuck_min = 10           # 한 번 훑기가 이만큼 끝나지 않으면 텔레그램 한 번 + 카드 목록에 사유
notify_ready = true      # 카드를 새로 만들면 텔레그램 한 번(세션 · 브랜치 끝 커밋마다 한 번)
projects = ["foreman", "ronanlab-infra", "petmint-rag-chatbot", "runshoes"]   # 카드를 만들 프로젝트(project.name). 비면 모두 — 11-11 사용자: 런슈즈 · 펫퍼민트에는 아직 보내지 않음, 인프라는 관리자 299와 함께 더함. 11-13 사용자: 펫퍼민트 관리자를 세우며 더함, 런슈즈는 5-2 합친 뒤 · squash 제목 고친 뒤 더함
stage = 1                # 1 = 합치기까지. 2(승인 뒤 시험 → push → 승인 대기 0 → 브리지 → 점검)는 사용자가 1단계를 써 본 뒤 정한다 — 아직 없음
remind_days = 5          # 관리자 머리 위 합치기 물음(사람 승인 카드)이 이 날수째면 텔레그램 바로 한 번 — 물음은 7일(ESC_KEEP) 뒤 사라지므로 그 이틀 전(11-13 사용자). 0 = 끔

[merge_prep.docs]
docs_dir = "docs"                    # 바뀐 파일 경로를 적은 줄을 찾을 폴더(.md만)
max = 12                             # 후보 수 상한

# 승인자 · squash — 프로젝트마다(11-12 사용자 결정, log/merge_approver_20261112.md). 칸이 없는 프로젝트는 사람 승인 · ff.
#   approver = "human"   사람이 패널 · 승인 막대의 [합치기](지금 동작)
#   approver = "manager" 카드가 생기면 그 프로젝트 관리자 세션에 알리고, 관리자가 자기 토큰으로
#                        POST /api/sessions/{sid}/merge-prep {"action":"merge","by":"manager"}로 승인한다. 정리 후보 고르기도 관리자.
#                        아래 [merge_prep.human_always]에 걸리거나 살아 있는 관리자 세션이 없으면 그 카드는 사람 승인
#   squash = true        커밋 하나로 묶어 합친다(본문에 원래 커밋 제목 · 날짜). 지금부터 합치는 것만 — 과거 이력은 그대로
#   human_paths          이 프로젝트에만 더하는 「늘 사람」 경로
# 바꾸면 브리지를 다시 띄운다. 되돌리기 = approver = "human" · squash = false
[merge_prep.per_project.foreman]
approver = "manager"   # 11-12 사용자: 먼저 켤 곳 FOREMAN · 인프라
squash = true
human_paths = ["docs/style_guide.md", "docs/operations.md", "docs/manuscript_rules.md"]   # 규칙 문서(CLAUDE.md가 가리키는 상세). 11-17 사용자: 원고 쓰는 기준은 사용자가 정하는 것이라 사람 승인

[merge_prep.per_project.ronanlab-infra]
approver = "manager"
squash = true
human_paths = []

[merge_prep.per_project.petmint-rag-chatbot]
approver = "manager"   # 11-13 사용자: 펫퍼민트 관리자를 세우며 인프라와 같게
squash = true
human_paths = []

[merge_prep.per_project.runshoes]
approver = "manager"   # 11-13 사용자: 5-2 합친 뒤 · squash 제목 고친 뒤(337 98492e6) 켬. 카드는 합치기까지, push는 관리자가 따로
squash = true
# 310이 든 그대로(11-13 사용자). 마이그레이션 순서 안내는 런슈즈 CLAUDE.md 「push할 때 볼 것」
human_paths = ["backend/src/main/resources/db/migration/V*.sql", "CLAUDE.md", ".claude/*", "Jenkinsfile", "Dockerfile", "Dockerfile.chatbot"]

# 늘 사람에게 올릴 것(11-12 사용자 확정) — 승인자가 관리자여도 카드의 바뀐 파일 · 커밋이 걸리면 그 카드는 사람 승인.
#   paths는 fnmatch(`*`가 `/`도 넘는다) — 경로 전체 또는 파일 이름에 맞대 본다.
#   경로로 못 가르는 것: 「사람이 직접 쓴 글」은 git으로 가르지 못한다 — 프로젝트 human_paths에 더하거나 관리자 규칙으로
[merge_prep.human_always]
paths = [
  "*values*.yaml", "*values*.yml",                       # 설정 · 값 파일
  "config/*.toml",
  "CLAUDE.md", "AGENTS.md", ".claude/*",                 # 규칙 문서
  "*migrations/*", "*db/migration/*", "*alembic/versions/*",   # 마이그레이션(FOREMAN · Flyway · alembic)
]
resource_keys = ["cpu", "memory", "replicas", "limits", "requests", "storage", "ephemeral-storage"]   # *.yaml에서 이 키 줄이 바뀌면 자원 크기
history_words = ["force push", "force-push", "push --force", "push -f", "filter-branch", "filter-repo", "reset --hard", "이력 다시 쓰"]
deletions = true     # 파일을 지운 커밋 = 지우기
submodules = true    # 서브모듈(gitlink) 바뀜 = 다른 저장소

# [move] — 새 세션으로 옮기기 한 흐름(11-11 C 2물결 「일곱」, bridge/static/js/moveflow.js).
#   켜면 [새 세션으로 옮기기] 하나가 잊은 것 찾기 → 문서 후보 목록 → (사람이 고르기) → 문서에 쓰기 → 요약 → 새 세션 → 옛 세션 끝내기를
#   이어서 한다. 사람이 하는 것은 「무엇을 문서에 넣을지 고르기」 하나. 옮기기 전 요약 확인 창은 없고, 넘어간 글은 새 세션 패널에 보인다.
#   끄면 옛 흐름(요약 → 확인 → 새 세션 → 옛 세션 끝내기, 잊은 것 찾기 · 문서에 적기는 따로 단추). 화면이 다음 새로 그릴 때 읽는다
[move]
one_flow = true    # 11-11 사용자 지시로 켬
