# Notion 게시(12c, 11-06) — bridge/notion.py · bridge/docsync.py. 원본은 git 마크다운, Notion은 게시판(사본).
# 토큰은 저장소 맨 위 .env.notion의 NOTION_TOKEN(내부 통합, 권한 읽기 · 업데이트 · 삽입). 통합은 「프로젝트」 페이지에 연결돼 있다(11-09) —
# 게시기는 프로젝트마다 root 아래만 고친다(Scope). 바꾸면 브리지를 다시 띄운다.
#
# 구조(11-09 사용자 결정):
#   프로젝트
#   ├ <프로젝트 페이지 = root>
#   │   ├ [기술문서]   = docs_page       docs/**/*.md(하위 폴더까지 — 11-09, docs/archive/ · skip의 "…/" 폴더 빼고). 차례는 docs/README.md 표 순서
#   │   └ [포트폴리오] = portfolio_page  portfolio/*.md(번호순)
#   └ 인프라(게시기가 다루지 않는다 — 사람이 쓴 문서)
#
# 칸: [<프로젝트 이름 = DB project.name>]
#   root · docs_page · portfolio_page  Notion 페이지 id(대시 없이)
#   github     저장소 링크(사본 머리말 · 상대 링크)
#   ref        원본 커밋. FOREMAN은 HEAD(이 저장소 main), 다른 프로젝트는 origin/main(push된 것 — Notion은 GitHub의 사본)
#   docs       off(기술문서를 다루지 않음) · manual(뒤처짐만 보이고 [지금 맞추기]로) · auto(docs 커밋 뒤 quiet_min분 조용하면 자동)
#   quiet_min  auto의 기다림(분)
# 사람이 Notion에서 고친 블록이 있으면 덮지 않고 알린다(11-09 사용자 결정 — git이 원본, 조용히 갈라지지 않게).

[foreman]
root = "4133218bb52481309e43c865c460eda2"             # 「프로젝트」 > "FOREMAN - AI 에이전트 관제실"(11-09 만듦)
docs_page = "40f3218bb52480ec8033dd26aedd17d5"        # [기술문서](11-06 사용자가 만든 옛 루트 — 이름만 바꿈)
portfolio_page = "4133218bb524816b832acf6a07f583c7"   # [포트폴리오] — 포트폴리오 10편을 여기로 옮김(11-09)
github = "https://github.com/Gabriel-Joo/foreman"
ref = "HEAD"
docs = "off"                                         # FOREMAN docs는 아직 올리지 않는다(요청 없음)

[runshoes]
root = "4133218bb524818e8a7df47d63345270"             # "RUNSHOES-러닝화 스펙·리뷰 아카이브"(11-09 만듦)
docs_page = "3e33218bb52480ffa796c8a04d324a06"        # [기술문서](사용자가 만든 페이지 — 옮기고 이름만 바꿈)
portfolio_page = "4133218bb52481dc803ce2938c011be0"   # [포트폴리오](11-09 만듦 — 런슈즈 포트폴리오는 아직 쓰지 않는다)
github = "https://github.com/Gabriel-Joo/runshoes"
ref = "origin/main"
docs = "auto"                                        # 런슈즈 요청 3절 — 기술 문서는 자동(docs는 git에서 이미 사람이 합친 원본)
quiet_min = 30

[petmint-rag-chatbot]
root = "4133218bb52481e9a348d79355fea5cd"             # "펫퍼민트 반려동물 보험약관 안내 챗봇"(11-09 만듦)
docs_page = "3ea3218bb5248091aa0bc1eb58ae9ccb"        # [기술문서](사람이 옮겨 둔 사본 01 · 02 등이 이미 있다)
portfolio_page = "4133218bb5248142883af1f21788f6ca"   # [포트폴리오](11-09 만듦)
github = "https://github.com/Gabriel-Joo/petmint-rag-chatbot"
ref = "origin/main"
docs = "auto"  # 11-09 docs를 Notion 구조로 옮긴 뒤(2e287cb, 짝 18개 새 경로) 다시 켬 — log/petmint_docs_move_20261109.md
quiet_min = 30
# 아래는 펫퍼민트만(사용자 결정 11-09, log/petmint_docsync_dryrun_20261109.md). 없으면 런슈즈 · FOREMAN처럼 기본 동작
create = true                       # 11-09 켬(사용자 — 모의 실행: 맨 뒤 번호만 만들고 중간 번호는 실패). 새 페이지는 new_parent · new_title대로
archive = false                     # 원본이 사라져도 휴지통으로 보내지 않고 실패로만(create와 따로 — 11-09 사용자: 사람이 보고 판단)
headings = "md"                     # 제목 단계를 마크다운 그대로(## → heading_2 · ### → 3 · #### → 4) — 사람이 옮긴 페이지 모양
new_parent = "folder"               # 새 문서: docs/<폴더>/x.md는 같은 폴더 형제들의 부모 아래(docs/02_pipeline/ → 「02. 파이프라인 설계」)
new_title = "numbered"              # 새 문서 제목 "19. 이름" — 번호는 파일 이름(03a → 03-1), 이름은 부모 원본 문서에서 그 번호로 시작하는 마지막 줄
title = "keep"                      # 제목 그대로("00. 모델 준비" — 사이드바 순서)
order = "keep"                      # 자리 · 차례 그대로(18쪽은 「02. 파이프라인 설계」 아래)
header = "footer"                   # 사본 상자 대신 맨 아래 회색 한 줄 "마지막 갱신 — 커밋 · 시각"
keep_notion = ["inline_code", "image", "heading", "shape"]   # 모양은 Notion 기준, 쪽 단위 글 비교(docs/12_scribe.md 5절 — 잃는 것)
skip = ["docs/README.md", "docs/next_rebuild.md", "docs/ops/"]   # docs/ops/ = 운영 기록 · 체크리스트 폴더 통째로(11-09 사용자 — 저녁실행 · 모드검증)

[ronanlab-infra]
# 11-10 프로젝트 등록 — 칸만. 인프라 저장소에 아직 docs/가 없다(인프라 세션이 묶음 1 문서 단계에서 만든다).
# root가 비어 있으면 브리지가 이 프로젝트의 게시기를 만들지 않는다(bridge/main.py) — 켤 때 사용자에게 물을 것:
#   root      위 「인프라」 페이지(사람이 쓴 문서 — 지금은 게시기가 다루지 않는다)를 쓸지, 새 프로젝트 페이지를 만들지
#   docs_page · portfolio_page   그 아래 [기술문서] · [포트폴리오]
# 11-12 인프라 관리자 299 요청 · 사용자 승인 — 한 쪽만 시험(09_monitoring). 값은 299가 적은 그대로
root = "4133218bb52481079af8f3712ad8d73c"        # 프로젝트 > 인프라
docs_page = "4153218bb52480069acbdd52063fe2c5"   # [기술문서]
portfolio_page = "4153218bb52480d39869e736a15b4b8f"   # [포트폴리오](비어 있음, 인프라 저장소에 portfolio/ 없음)
github = "https://github.com/Gabriel-Joo/ronanlab-infra"
ref = "origin/main"
docs = "manual"
quiet_min = 30
create = false      # 시험 동안. 짝 없는 문서는 만들지 않고 실패로만
archive = false
headings = "md"
order = "keep"      # 01~09가 쿠버네티스 설치 페이지 아래에 있다. 옮기지 않는다
title = "keep"      # 제목 H1 선택지가 생기면 그때 바꾼다
header = "footer"
skip = ["docs/README.md", "docs/TODO.md", "docs/runbooks/", "docs/history/notion_sync_20261112.md"]
