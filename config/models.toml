# 세션 모델(11-05) — [+ 세션] · 포먼 계획 카드에서 고르는 모델과 역할별 기본값.
# id는 `claude --model` 값(별칭 opus · sonnet · haiku는 CC가 그때의 최신으로 푼다). 바꾸면 브리지를 다시 띄운다.
# 실제로 쓴 모델은 트랜스크립트의 메시지마다 남는다(DB message.model) — 화면은 그것을 보인다.

choices = [
  { id = "opus",   label = "Opus",   note = "가장 잘하지만 비쌉니다" },
  { id = "sonnet", label = "Sonnet", note = "대부분의 일에 충분합니다" },
  { id = "haiku",  label = "Haiku",  note = "가볍고 빠른 일" },
]

# 역할별 기본값. 없는 역할 · 빈 값이면 CC 설정을 따른다(--model 없이 띄운다)
[defaults]
coder     = "opus"
inspector = "sonnet"
cicd      = "sonnet"
scribe    = "opus"
manager   = "opus"     # 관리자(11-09) — 합치기 · 시험 · push · 기록. 판단이 많아 opus

# 세션이 아닌 `claude -p` 일감의 모델(11-06). 바꾸면 브리지를 다시 띄운다
[tasks]
losscheck = "sonnet"     # [잃은 것 보기] 판정 — 11-06 정답과 맞대 확정(재현율 0.71 · 정밀도 0.91, 한 번 약 2달러). log/handoff_v2_d_result.md

# 모델 family별 컨텍스트 창 크기(토큰, 11-09) — 패널 「쌓인 대화 N%」와 notify.toml [compact] context_pct의 분모.
# DB message.model에는 [1m] 같은 접미사가 붙지 않아 모델 id로는 창을 알 수 없다. 그래서 여기에 적는다.
#  - opus: 1M — 실측으로 확인(claude-opus-5-5 응답 하나의 맥락이 971,510까지 갔다. 200k 창이면 불가능)
#  - sonnet · haiku: **추정값(200k)** — 지금까지 본 최대가 90k · 114k뿐이라 확인하지 못했다.
#    실제 맥락이 이 값을 넘는 기록이 보이면 추정이 틀린 것이다: 브리지가 로그와 텔레그램으로 알리고 %는 100%로 막는다. 알려 오면 고친다
# 목록에 없는 모델은 %를 보이지 않고 토큰(k)만 보인다. 바꾸면 브리지를 다시 띄운다
[windows]
opus   = 1000000
sonnet = 200000
haiku  = 200000
