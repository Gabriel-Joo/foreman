# 세션 모델(11-05) — [+ 세션] · 포먼 계획 카드 · 패널 머리줄 모델 창(「이 세션의 모델」)에서 고르는 모델과 역할별 기본값.
# id는 `claude --model` 값이자 세션 안에서 모델을 바꿀 때 쓰는 값이다. 11-14부터 버전까지 적은 전체 id를 쓴다 —
# 별칭(opus 등)은 CC가 그때의 최신으로 풀어 Opus 5.5와 Opus 5가 둘 다 「Opus」로 묶였다(사용자).
# 11-14 CC 2.1.325에서 전체 id 다섯을 `claude -p --model`과 세션 안 모델 바꾸기로 실제 확인했다(log/foreman-3_model_menu_20261114.md).
# 새 모델이 나오면 choices · [aliases]를 함께 고친다. 바꾸면 브리지를 다시 띄운다.
# 실제로 쓴 모델은 트랜스크립트의 메시지마다 남는다(DB message.model) — 화면은 그것을 보인다.
# note는 화면 창의 설명 줄이다(화면 글 약속, 가운뎃점을 쓰지 않는다 — docs/style_guide.md 「4-1. 화면 글」).

choices = [
  { id = "claude-opus-5-5",   label = "Opus 5.5",   note = "가장 잘하지만 비쌉니다" },
  { id = "claude-opus-5",     label = "Opus 5",     note = "Opus 5.5의 앞 버전입니다" },
  { id = "claude-sonnet-5-5", label = "Sonnet 5.5", note = "대부분의 일에 충분합니다" },
  { id = "claude-haiku-5-5",  label = "Haiku 5.5",  note = "가볍고 빠른 일에 맞습니다" },
  { id = "claude-fable-5-2",  label = "Fable 5.2",  note = "가장 비싸고, 주간 한도가 따로 있습니다" },
]

# 옛 이름(별칭) → 목록의 id(11-14). 목록에는 보이지 않고 받기만 한다 — 11-14 전에 띄운 세션의 DB 값(opus · sonnet · haiku)이
# [이어서] · 새 세션으로 옮기기에서 그대로 쓰이고, API로 별칭을 보내도 받게. 받은 별칭은 오른쪽 id로 바꿔 쓴다
[aliases]
opus   = "claude-opus-5-5"
sonnet = "claude-sonnet-5-5"
haiku  = "claude-haiku-5-5"
fable  = "claude-fable-5-2"

# 역할별 기본값. 없는 역할 · 빈 값이면 CC 설정을 따른다(--model 없이 띄운다)
[defaults]
coder     = "claude-opus-5-5"
inspector = "claude-sonnet-5-5"
scribe    = "claude-opus-5-5"
manager   = "claude-opus-5-5"     # 관리자(11-09) — 합치기 · 시험 · push · 기록. 판단이 많아 opus
designer  = "claude-opus-5-5"     # 디자이너(11-10) — 화면 · 테마 자리 · 캐릭터. 사진을 보고 자리 · 겹침을 판단하고 office.js가 커서 opus(코더와 같다)

# 세션이 아닌 `claude -p` 일감의 모델(11-06). 바꾸면 브리지를 다시 띄운다
[tasks]
losscheck = "claude-sonnet-5-5"     # [잃은 것 보기] 판정 — 11-06 정답과 맞대 확정(재현율 0.71 · 정밀도 0.91, 한 번 약 2달러). log/handoff_v2_d_result.md

# 모델별 컨텍스트 창 크기(토큰, 11-09) — 패널 「쌓인 대화 N%」와 notify.toml [compact] context_pct의 분모.
# DB message.model에는 [1m] 같은 접미사가 붙지 않아 모델 id로는 창을 알 수 없다. 그래서 여기에 적는다.
# 키는 메시지의 모델 id(claude-opus-5-5) 또는 family(opus)다 — id가 먼저, 없으면 family(11-14, bridge/model_choice.window_of).
# 11-14 버전마다 창이 다를 수 있어 id로 적었다. 모르는 모델은 적지 않는다 — 목록에 없는 모델은 %를 보이지 않고 토큰(k)만 보인다.
#  - claude-opus-5-5: 1M — 실측으로 확인(응답 하나의 맥락이 971,510까지 갔다. 200k 창이면 불가능)
#  - claude-haiku-5-5: **추정값(200k)** — 지금까지 본 최대 114k뿐이라 확인하지 못했다
#  - claude-sonnet-5-5: 11-14 뺌(모름) — 200k로 추정했는데 본 대화 맥락이 223,147까지 간 기록이 있다(11-13). 200k는 틀렸고 실제 창은 확인하지 못했다
#  - claude-opus-5 · claude-fable-5-2: 모름(확인한 적 없다)
#  실제 맥락이 이 값을 넘는 기록이 보이면 추정이 틀린 것이다: 브리지가 로그와 텔레그램으로 알리고 %는 100%로 막는다. 알려 오면 고친다
# 바꾸면 브리지를 다시 띄운다
[windows]
"claude-opus-5-5"  = 1000000
"claude-haiku-5-5" = 200000
