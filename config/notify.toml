# FOREMAN 텔레그램 알림 규칙 (로드맵 4단계). 바꾸면 브리지를 다시 띄운다.
# 비밀값은 여기 두지 않는다 — 토큰 · chat_id는 저장소 맨 위 .env.telegram
#
# 턴이 닫히는 순간(먼저 온 신호 — Stop hook · turn_duration · 중단 표시 · API 오류 · 프로세스 소멸) 브리지가 판정해 보낸다.
# 보낸 것과 안 보낸 것(+규칙 이름)은 DB notification 테이블에 남는다.

[telegram]
enabled = true
env_file = ".env.telegram"     # TELEGRAM_BOT_TOKEN · TELEGRAM_CHAT_ID (저장소 기준 경로)
timeout_s = 10
min_interval_s = 1.1           # 같은 방에 초당 1건 남짓(텔레그램 제한)
settle_s = 2.0                 # 턴이 닫힌 뒤 이만큼 기다렸다 쓴다 — Stop hook이 마지막 응답 줄보다 먼저 온다(2단계 실측)

[defaults]
# 이 종료 이유면 보낸다. merged(응답 없이 다음 입력에 합쳐짐) · no_signal은 기본으로 안 보낸다 — 다음 턴이 알린다
end_reasons = ["stop", "stop_failure", "interrupted", "session_end", "process_lost"]
# 이 출처의 턴이 끝나면 보낸다. agent_message(다른 세션이 보낸 메시지로 연 턴)는 기본으로 안 보낸다
origins = ["human", "meta"]
# 이 출처의 턴은 따로 보내지 않고, 그 세션의 백그라운드 서브에이전트가 모두 끝났을 때 한 번 묶어서 보낸다.
# subagent_message = 서브에이전트가 결과를 돌려주며 연 턴(<agent-message from=…>, task-notification보다 먼저 온다)
batch_origins = ["task_notification", "subagent_message"]
only_failures = false          # true면 stop_failure · interrupted · process_lost만
min_turn_s = 0                 # 이보다 짧게 끝난 턴은 보내지 않는다(실패는 예외)

# 프로젝트별 — 접두어가 있는 프로젝트만 보낸다('미분류' 세션은 안 보낸다). 위 defaults를 덮어쓸 수 있다
[projects.runshoes]
prefix = "[런슈즈]"

[projects.petmint-rag-chatbot]
prefix = "[펫퍼민트]"
# 펫퍼민트 CLAUDE.md의 원래 규칙 "짧은 작업(5분 안)이나 단순 확인에는 보내지 않는다"를 옮긴 것(실패는 예외)
min_turn_s = 300

[projects.foreman]
prefix = "[포먼]"

# 압축 알림(11-05, docs/11_handoff_v2.md 3장) — 압축 손실 점검 두 번에서 지시 · 결정의 약 63%가 빠졌고,
# 가장 많이 빠진 때가 말한 뒤 두 번째 압축이었다. 압축 직후(맥락이 가벼울 때) 알린다. 접두어 있는 프로젝트만 보낸다
[compact]
due_at = 2          # 이 횟수부터 "넘어갈 때" — 캐릭터 📦 · 패널 띠
late_at = 4         # 이 횟수부터 "늦었음"(빨강)
notify_at = [2, 4]  # 이 횟수의 압축 직후 텔레그램(한 번씩)
short_turns = 3     # 압축 사이 사람 턴이 이 이하로 두 번 이어지면 "맥락이 금방 찬다"를 덧붙인다
