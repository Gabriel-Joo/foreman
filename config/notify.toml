# FOREMAN 텔레그램 알림 규칙 (로드맵 4단계). 바꾸면 브리지를 다시 띄운다.
# 비밀값은 여기 두지 않는다 — 토큰 · chat_id는 저장소 맨 위 .env.telegram
#
# 턴이 닫히는 순간(먼저 온 신호 — Stop hook · turn_duration · 중단 표시 · API 오류 · 프로세스 소멸) 브리지가 판정해 보낸다.
# 보낸 것과 안 보낸 것(+규칙 이름)은 DB notification 테이블에 남는다.

[telegram]
enabled = true
env_file = ".env.telegram"     # TELEGRAM_BOT_TOKEN · TELEGRAM_CHAT_ID (저장소 기준 경로)
timeout_s = 10
min_interval_s = 1.1           # 같은 방에 초당 1건 남짓(텔레그램 제한)
settle_s = 2.0                 # 턴이 닫힌 뒤 이만큼 기다렸다 쓴다 — Stop hook이 마지막 응답 줄보다 먼저 온다(2단계 실측)

[defaults]
# 이 종료 이유면 보낸다. merged(응답 없이 다음 입력에 합쳐짐) · no_signal은 기본으로 안 보낸다 — 다음 턴이 알린다
end_reasons = ["stop", "stop_failure", "interrupted", "session_end", "process_lost"]
# 이 출처의 턴이 끝나면 보낸다. agent_message(다른 세션이 보낸 메시지로 연 턴)는 기본으로 안 보낸다
origins = ["human", "meta"]
# 이 출처의 턴은 따로 보내지 않고, 그 세션의 백그라운드 서브에이전트가 모두 끝났을 때 한 번 묶어서 보낸다.
# subagent_message = 서브에이전트가 결과를 돌려주며 연 턴(<agent-message from=…>, task-notification보다 먼저 온다)
batch_origins = ["task_notification", "subagent_message"]
only_failures = false          # true면 stop_failure · interrupted · process_lost만
min_turn_s = 0                 # 이보다 짧게 끝난 턴은 보내지 않는다(실패는 예외)

# 프로젝트별 — 접두어가 있는 프로젝트만 보낸다('미분류' 세션은 안 보낸다). 위 defaults를 덮어쓸 수 있다
[projects.runshoes]
prefix = "[런슈즈]"

[projects.petmint-rag-chatbot]
prefix = "[펫퍼민트]"
# 펫퍼민트 CLAUDE.md의 원래 규칙 "짧은 작업(5분 안)이나 단순 확인에는 보내지 않는다"를 옮긴 것(실패는 예외)
min_turn_s = 300

[projects.foreman]
prefix = "[FOREMAN]"

[projects.ronanlab-infra]
prefix = "[인프라]"

# 압축 알림(11-05, docs/11_handoff_v2.md 3장) — 압축 손실 점검 두 번에서 지시 · 결정의 약 63%가 빠졌고,
# 가장 많이 빠진 때가 말한 뒤 두 번째 압축이었다. 압축 직후(맥락이 가벼울 때) 알린다. 접두어 있는 프로젝트만 보낸다
[compact]
due_at = 2          # 이 횟수부터 "넘어갈 때" — 캐릭터 📦 · 패널 띠
late_at = 4         # 이 횟수부터 "늦었음"(빨강)
notify_at = [2, 4]  # 이 횟수의 압축 직후 텔레그램(한 번씩)
short_turns = 3     # 압축 사이 사람 턴이 이 이하로 두 번 이어지면 "맥락이 금방 찬다"를 덧붙인다
# 맥락 크기(11-08, 사용자 승인) — 마지막 응답 맥락(입력 + 캐시 읽기 + 캐시 쓰기)이 이만큼이면 첫 값 "넘어갈 때", 끝 값 "늦었음".
# 처음 넘을 때 텔레그램 한 번씩(세션마다) · 패널 띠. 응답마다 이 맥락 전체를 다시 읽는다 — 주간 사용의 57%가 캐시 읽기였다(log/stage15)
context_at = [300000, 500000]
# 맥락 비율(11-09, 사용자 승인) — 마지막 응답 맥락 ÷ 그 모델의 창(config/models.toml [windows]). 첫 값 "넘어갈 때", 끝 값 "늦었음".
# context_at과 **둘 중 먼저 닿는 쪽**이 이긴다. 토큰 문턱(300k · 500k)은 비용(응답마다 맥락 전체를 다시 읽는다)에서 나왔고,
# 비율 문턱은 창이 작은 모델에서 그 토큰 문턱이 영영 닿지 않는 틈(200k 창이면 300k는 도달 불가)을 메운다.
# 50% · 75%의 근거 — 자동 요약은 창이 80~90% 찼을 때 일어난다. 75%는 그 직전 마지막 경고(요약 전에 알려야 한다),
# 50%는 요약 전에 손실 없이 옮기기 좋은 때. 두 번째 요약에서 가장 많이 잃는다는 점검 결과(log/*_compaction_loss_20261105.md)가 이유다.
# 1M 창(Opus)에서는 토큰 문턱이 먼저 닿아 (300k → 30%, 500k → 50%) 동작이 그대로다
context_pct = [50, 75]
# 작업 전환 권유(11-09) — 이 비율 이상 찬 세션에서, 사람이 다음 일로 넘어가는 말을 하고 커밋 · 유휴가 겹치면 [새 세션으로 옮기기]를 권한다
switch_min_pct = 40

# 겹침 알림(11-06, bridge/overlap.py) — 사람 입력이 들어오면 같은 프로젝트의 살아 있는 다른 세션이 최근 받은 요청과
# 드문 낱말로 맞대 본다. 막지 않고 알리기만(텔레그램 — 접두어 있는 프로젝트만 · 패널 띠). 포먼의 서기 일감은 맞대지 않는다.
# 기준은 지난 30일 사람 요청 949개를 다시 돌려 정했다 — 11건(살아 있음을 따지지 않은 상한), 11-06 jenkins-0 사례 점수 6
[overlap]
enabled = true
window_min = 180    # 다른 세션의 이 시간 안의 사람 요청과 맞댄다
per_session = 5     # 다른 세션마다 최근 요청 몇 개까지
min_score = 3       # 이 점수부터 알린다 — 식별자(jenkins-0 · bridge.db.migrate처럼 -_. 숫자가 섞인 것) 2점, 영문 낱말 1점, 한글 0점
rare_ratio = 0.01   # 최근 사람 요청에서 이 비율 이하로 나오는 낱말만 "드문 낱말"
rare_min_df = 3     # 요청이 적을 때 — 이 수 이하로 나오면 드문 낱말
repeat_min = 60     # 같은 두 세션은 이 시간 안에 다시 알리지 않는다
show_min = 120      # 패널 띠를 보이는 시간
