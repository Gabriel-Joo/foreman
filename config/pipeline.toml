# FOREMAN CI/CD 인과 체인 (로드맵 8단계). 바꾸면 브리지를 다시 띄운다.
# 비밀값은 여기 두지 않는다 — 웹훅 토큰은 .env.bridge의 FOREMAN_WEBHOOK_TOKEN
#
# 11-03 재개 — Jenkins는 Jenkinsfile 알림(foremanNotify → 192.168.122.1:8001/webhooks/jenkins) + 토큰 없는 보정.
# Jenkins API 토큰은 쓰지 않는다 — 로그인 = 전체 권한이라 그 토큰은 배포 경로 전체의 열쇠다("새도 되는 비밀의 무게", log/stage8_cicd_result.md)
#
# 실제 흐름(11-03 live 설정):
#   로컬 커밋 → GitHub push → Jenkins 웹훅(+ 폴링 15분 안전망) → BuildKit 빌드 → Harbor push(태그 = 커밋 12자리)
#   → ronanlab-infra apps/<앱>/kustomization.yaml newTag 커밋 → ArgoCD 웹훅(+ 폴링 3분) → 런슈즈 자동 Sync / 펫퍼민트 수동 Sync

[git]
poll_s = 20                    # 로컬 저장소에서 새 커밋 · push를 찾는 주기(빠진 알림 찾기의 기준 — origin/<브랜치>가 움직였나)
attribute_window_s = 300       # git commit 도구 호출과 커밋 시각이 이만큼 안이면 그 세션의 커밋

# 빠진 알림 찾기 — 알림만으로는 "알림이 안 왔다 = 빌드가 없었다"를 믿을 수 없다(문법 오류 · 에이전트 파드 · 재시작 · 웹훅 유실 · 알림 실패)
[watch]
started_warn_s = 180           # push 뒤 시작 알림 없이 3분 → 화면 노란색(웹훅이면 몇 초 안에 시작한다)
started_alert_s = 1020         # 17분(폴링 15분 + 2분) → 텔레그램 "빌드 알림 없음 — Jenkins 확인"
completed_alert_s = 2100       # 시작은 왔는데 35분(Jenkinsfile timeout 30분 + 5분) 끝 알림 없음 → 텔레그램
webhook_break_after = 2        # 웹훅으로 시작한 적 있는 job에서 폴링 원인 빌드가 연달아 이만큼 → "웹훅 끊김 의심"

[infra]
poll_s = 60                    # 인프라 캐릭터 생존 확인 주기
stale_after = 3                # 연달아 이만큼 응답이 없으면 STALE
alert_after = 5                # 연달아 이만큼(5분) 응답이 없으면 텔레그램 "[포먼] Jenkins 응답 없음"(종류마다 한 번, 돌아오면 한 번)
                               # — 11-06 정전 뒤 Jenkins init이 계속 실패했는데 화면 STALE · journal 한 줄뿐이었다. helm 재시작(42초)은 넘긴다
retire_after_h = 24            # STALE로 이만큼 지나면 퇴장(retired_at). 다시 응답하거나 웹훅이 오면 돌아온다
ingress = "http://192.168.122.240"   # ingress-nginx VIP(MetalLB) — 호스트에서 *.ronanlab.dev 이름은 Cloudflare Access로 간다

# ArgoCD 직접 읽기(11-09) — 끝 알림(Healthy)이 안 와 "진행 중"에 남은 행을 10분 뒤 읽어 닫는다. 30분이 지나도 안 끝났거나
# 못 읽으면 행마다 텔레그램 한 번("배포가 끝나지 않습니다"). 호스트에 kubectl이 없어 vagrant ssh로(읽기 전용 kubectl get)
[argocd_read]
vagrant_dir = "~/k8s-cluster"
vm = "m-k8s"
namespace = "argocd"
# 인프라 캐릭터 — 첫 웹훅을 받으면 프로젝트마다 등장한다(README 2.2). 생존은 이 주소를 폴링한다(Host 헤더로 ingress에)
[infra.jenkins]
name = "Jenkins"
host = "jenkins.ronanlab.dev"
health = "/login"
[infra.harbor]
name = "Harbor"
host = "harbor.ronanlab.dev"
health = "/api/v2.0/ping"
[infra.argocd]
name = "ArgoCD"
host = "argocd.ronanlab.dev"
health = "/api/version"

# 프로젝트마다 각 단계의 이름 — 웹훅이 어느 프로젝트 것인지 가른다
[projects.runshoes]
branch = "main"
jenkins_job = "runshoes-app"
harbor_project = "runshoes"
argocd_app = "runshoes"

[projects.petmint-rag-chatbot]
branch = "main"
jenkins_job = "petmint-app"
harbor_project = "petmint"
argocd_app = "petmint"
