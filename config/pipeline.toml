# FOREMAN CI/CD 인과 체인 (로드맵 8단계). 바꾸면 브리지를 다시 띄운다.
# 비밀값은 여기 두지 않는다 — 웹훅 토큰은 .env.bridge의 FOREMAN_WEBHOOK_TOKEN
#
# ⏸ 11-02 보류 — 브리지에서 꺼 둠(pipeline_enabled = False). 읽기 조회로 다시 만든다(ArgoCD App of Apps 뒤, log/stage8_cicd_result.md)
#
# 실제 흐름(11-02 live 설정 조사 — 전 구간 폴링, 웹훅 없음):
#   로컬 커밋 → GitHub push → Jenkins SCM 폴링(2분) → BuildKit 빌드 → Harbor push(태그 = 커밋 12자리)
#   → ronanlab-infra apps/<앱>/kustomization.yaml newTag 커밋 → ArgoCD 폴링(3분) → 런슈즈 자동 Sync / 펫퍼민트 수동 Sync

[git]
poll_s = 20                    # 로컬 저장소에서 새 커밋 · push를 찾는 주기
attribute_window_s = 300       # git commit 도구 호출과 커밋 시각이 이만큼 안이면 그 세션의 커밋

[infra]
poll_s = 60                    # 인프라 캐릭터 생존 확인 주기
stale_after = 3                # 연달아 이만큼 응답이 없으면 STALE
retire_after_h = 24            # STALE로 이만큼 지나면 퇴장(retired_at). 다시 응답하거나 웹훅이 오면 돌아온다
ingress = "http://192.168.122.240"   # ingress-nginx VIP(MetalLB) — 호스트에서 *.ronanlab.dev 이름은 Cloudflare Access로 간다

# 인프라 캐릭터 — 첫 웹훅을 받으면 프로젝트마다 등장한다(README 2.2). 생존은 이 주소를 폴링한다(Host 헤더로 ingress에)
[infra.jenkins]
name = "Jenkins"
host = "jenkins.ronanlab.dev"
health = "/login"
[infra.harbor]
name = "Harbor"
host = "harbor.ronanlab.dev"
health = "/api/v2.0/ping"
[infra.argocd]
name = "ArgoCD"
host = "argocd.ronanlab.dev"
health = "/api/version"

# 프로젝트마다 각 단계의 이름 — 웹훅이 어느 프로젝트 것인지 가른다
[projects.runshoes]
branch = "main"
jenkins_job = "runshoes-app"
harbor_project = "runshoes"
argocd_app = "runshoes"

[projects.petmint-rag-chatbot]
branch = "main"
jenkins_job = "petmint-app"
harbor_project = "petmint"
argocd_app = "petmint"
