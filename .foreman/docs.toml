# 문서 규칙(FOREMAN 문서 도구가 읽는다, tools/docs.py). 없는 칸은 FOREMAN 기본값
# 바뀌어도 코드로 세지 않는 파일. 근거 표시를 달 문장이 없는 것(빈 패키지 표시 파일, 무시 목록)이라 「근거가 없는 파일」 셈에서 뺀다
not_code = [".md", ".gitignore", "bridge/__init__.py", "bridge/api/__init__.py", "bridge/db/__init__.py", "bridge/doctext/__init__.py"]

[check]
# 새 줄 em dash와 가운뎃점 검사의 기준 커밋. 이 규칙이 들어오기 바로 전 main(11-17). 이 커밋 뒤에 더한 줄만 본다. 바꾸지 않는다
dashdot_base = "648ac08a0285c88626a2d5c16ae98732f47cb8a8"

[readme]
# 맨 위 README.md는 생성물이다(tools/docs.py readme, 점검 9번). 설계는 docs/00_design.md, 규칙은 CLAUDE.md(11-17 사용자)
# 제목만 적는다. 안 적으면 origin 이름 foreman이 된다. 게시 기록 프로젝트 이름은 origin 이름 그대로라 칸이 없다
title = "FOREMAN"
# docs 차례(11-17 사용자: 손으로 쓴 차례는 낡는다, 상태 칸은 두지 않는다). 요약은 첫 # 줄 뒤 첫 문단의 첫 문장.
# FOREMAN docs 머리의 「> 상태: …」 인용은 상태라 요약으로 쓰지 않는다
docs = true
docs_summary = "para"
docs_skip = ["상태:"]
