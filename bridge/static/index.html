<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOREMAN 확인</title>
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7; --ok:#1a7f37; --bad:#c62828; --code:#f5f5f7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#e8e8ea; --muted:#9a9aa0; --line:#333; --ok:#4ade80; --bad:#f87171; --code:#1c1c1e; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, sans-serif; }
  h1 { font-size:18px; margin:0 0 4px; }
  p.note { color:var(--muted); margin:0 0 16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  input, select, textarea { flex:1 1 260px; min-width:0; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  button { padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:var(--code); color:var(--fg); cursor:pointer; }
  #state { font-weight:600; }
  #state.ok { color:var(--ok); } #state.bad { color:var(--bad); }
  /* 서버 연결 끊김 — 화면 전체를 덮는다(README 3.10: 서버가 죽으면 브리지도 죽으므로 브라우저가 침묵으로 안다) */
  #down { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:16px;
          background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:blur(2px); z-index:10; }
  #down.on { display:flex; }
  #down .box { max-width:420px; width:100%; border:2px solid var(--bad); border-radius:10px; padding:16px 18px; background:var(--bg); }
  #down h2 { margin:0 0 6px; font-size:17px; color:var(--bad); }
  #down p { margin:4px 0; color:var(--muted); }
  #appr { margin-bottom:12px; display:grid; gap:8px; }
  .card { border:1px solid var(--line); border-left:4px solid var(--bad); border-radius:6px; padding:8px 10px; background:var(--bg); }
  .card.done { border-left-color:var(--line); opacity:.6; }
  .card code { display:block; white-space:pre-wrap; word-break:break-all; background:var(--code); padding:4px 6px; border-radius:4px; margin:4px 0; font-size:12px; }
  .card .meta { color:var(--muted); font-size:12px; }
  .card button { margin-right:6px; }
  h2.sec { font-size:15px; margin:4px 0; }
  #log { background:var(--code); border:1px solid var(--line); border-radius:6px; padding:8px; height:60vh; overflow:auto; font:12px/1.45 ui-monospace, monospace; white-space:pre-wrap; word-break:break-all; }
</style>
</head>
<body>
<h1>FOREMAN 브리지 — 확인</h1>
<p class="note">CC 세션의 실제 이벤트(트랜스크립트 · hook)와 턴 열기 · 닫기가 흐른다. 디버그 이벤트도 보낼 수 있다. 토큰은 이 탭에만 둔다(sessionStorage).</p>

<div class="row">
  <input id="token" type="password" placeholder="FOREMAN_API_TOKEN 값" autocomplete="new-password">
  <span id="toklen" class="note"></span>
  <button id="connect">연결</button>
  <span id="state">끊김</span>
</div>
<div class="row">
  <input id="target" placeholder="target (비우면 기본 문구)">
  <button id="emit">이벤트 보내기</button>
  <button id="health">healthz</button>
  <button id="ingest">수집 상태</button>
  <label><input id="raw" type="checkbox"> JSON 그대로</label>
</div>
<div class="row">
  <select id="sess"><option value="">세션 목록을 불러오세요</option></select>
  <button id="loadSess">세션 목록</button>
  <label><input id="cmd" type="checkbox"> '/'를 슬래시 명령으로</label>
</div>
<div class="row">
  <textarea id="inputText" rows="3" placeholder="세션에 보낼 입력 (첫 글자 '!'는 항상 막힌다 — 앞에 공백을 붙여 보낸다)"></textarea>
  <button id="send">주입</button>
</div>
<div class="row"><h2 class="sec">승인 대기</h2><button id="loadAppr">새로고침</button><span id="apprCount" class="note"></span></div>
<div id="appr"></div>
<div id="log"></div>
<div id="down" role="alert" aria-live="assertive"><div class="box">
  <h2>서버 연결 끊김</h2>
  <p id="downWhy">브리지와 연락이 없다.</p>
  <p id="downNext"></p>
  <p><button id="retryNow">지금 다시 연결</button></p>
</div></div>

<script>
const $ = id => document.getElementById(id);
const log = (obj) => {
  const line = `${new Date().toLocaleTimeString()}  ${typeof obj === 'string' ? obj : JSON.stringify(obj)}\n`;
  $('log').textContent = line + $('log').textContent;
};
const setState = (txt, cls) => { $('state').textContent = txt; $('state').className = cls || ''; };
// .env.bridge 줄을 통째로 붙여넣은 경우(FOREMAN_API_TOKEN=… · 따옴표)를 값만 남긴다. 값은 화면에 내지 않고 길이만 보인다
const tokenValue = () => $('token').value.trim().replace(/^FOREMAN_API_TOKEN=/, '').replace(/^(['"])(.*)\1$/, '$2');
const showLen = () => { const n = tokenValue().length; $('toklen').textContent = n ? `길이 ${n}` : ''; };
try { $('token').value = sessionStorage.getItem('foremanToken') || ''; } catch (e) {}
showLen();
$('token').addEventListener('input', showLen);

let ws = null, lastSeen = 0, hb = 15, watchdog = null;
// 재연결: 한 번이라도 연결된 뒤 끊기면 화면을 덮고 1 → 2 → 4 … 최대 15초 간격으로 다시 붙는다.
// 토큰이 틀려 끊긴 것(1008)은 다시 해도 같으니 덮지 않고 멈춘다
let wanted = false, everUp = false, tries = 0, retryTimer = null, countdown = null, downSince = null;

function showDown(why) {
  if (!downSince) downSince = Date.now();
  $('down').classList.add('on');
  $('downWhy').textContent = `${why} — ${new Date(downSince).toLocaleTimeString()}부터`;
}
function hideDown() {
  if (downSince) log(`재연결됨 — 끊겨 있던 시간 ${Math.round((Date.now() - downSince) / 1000)}초`);
  downSince = null;
  $('down').classList.remove('on');
}
function scheduleRetry() {
  clearTimeout(retryTimer); clearInterval(countdown);
  const wait = Math.min(15, 2 ** Math.min(tries, 4));
  tries += 1;
  let left = wait;
  $('downNext').textContent = `${left}초 뒤 다시 연결 (시도 ${tries})`;
  countdown = setInterval(() => { left -= 1; if (left > 0) $('downNext').textContent = `${left}초 뒤 다시 연결 (시도 ${tries})`; }, 1000);
  retryTimer = setTimeout(() => { clearInterval(countdown); $('downNext').textContent = `연결 중… (시도 ${tries})`; open_(); }, wait * 1000);
}

function connect() {
  wanted = true; tries = 0;
  clearTimeout(retryTimer);
  open_();
}

function open_() {
  const token = tokenValue();
  try { sessionStorage.setItem('foremanToken', token); } catch (e) {}
  if (ws) { ws.onclose = null; ws.close(); }
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const sock = new WebSocket(`${proto}://${location.host}/ws`);
  ws = sock;
  setState('연결 중…');
  sock.onopen = () => sock.send(JSON.stringify({ type: 'auth', token }));
  sock.onmessage = (m) => {
    lastSeen = Date.now();
    const msg = JSON.parse(m.data);
    if (msg.type === 'hello') { hb = msg.heartbeat_s; setState('연결됨', 'ok'); everUp = true; tries = 0; hideDown(); loadApprovals(); }
    if (msg.type === 'approval') apprCard(msg.op === 'resolved' ? msg.approval : { ...msg.approval, status: 'pending' });
    if (msg.type !== 'ping') log(fmt(msg));
  };
  sock.onclose = (e) => {
    if (ws !== sock) return;
    const why = `code ${e.code}${e.reason ? ' — ' + e.reason : ''}`;
    setState(`끊김 (${why})`, 'bad');
    log(`close ${why}`);
    if (e.code === 1008) { wanted = false; hideDown(); return; }   // 인증 실패 — 토큰을 고쳐야 한다
    if (wanted && everUp) { showDown(e.code === 1006 ? '서버가 응답하지 않는다(1006)' : `연결이 닫혔다(${why})`); scheduleRetry(); }
  };
  clearInterval(watchdog);
  // 하트비트 두 번을 놓치면 끊긴 것으로 본다 — 서버가 멈췄는데 소켓은 안 닫힌 경우(README 3.10)
  lastSeen = Date.now();
  watchdog = setInterval(() => {
    if (ws === sock && sock.readyState === 1 && Date.now() - lastSeen > hb * 2000 + 2000) {
      setState('응답 없음', 'bad'); sock.close(4000, 'heartbeat');
    }
  }, 1000);
}

// 한 줄 요약: [프로젝트] #턴 종류 도구 대상/요약
function fmt(msg) {
  if ($('raw').checked) return msg;
  if (msg.type === 'turn') {
    const p = msg.project || '미분류';
    return msg.op === 'open' ? `▶ [${p}] 턴 #${msg.turn_id} 열림 (${msg.origin}, ${msg.by})`
                             : `■ [${p}] 턴 #${msg.turn_id} 닫힘 — ${msg.reason} (${msg.by})`;
  }
  if (msg.type === 'approval') {
    const a = msg.approval;
    return msg.op === 'pending' ? `🔐 [${a.project || '미분류'}] 승인 대기 #${a.id} ${a.tool} — ${a.rule}` : `🔓 승인 #${a.id} → ${a.status}`;
  }
  if (msg.type === 'event') {
    const e = msg.event, p = e.project || (e.source === 'debug' ? 'debug' : '미분류');
    if (e.type === 'approval_req') {
      const pl = e.payload || {};
      return `  [세션 #${e.session_id}] 판정 ${pl.decision}${pl.enforced ? '' : '(관찰)'} ${e.tool} ${(e.target || '').slice(0, 80)} — ${pl.rule}`;
    }
    const who = e.subagent_id ? ` ↳서브${e.subagent_id}` : '';
    const what = [e.tool, e.target || e.summary].filter(Boolean).join(' ');
    if (e.type === 'input') {
      const pl = e.payload || {};
      return `⇢ [세션 #${e.session_id}] 주입 ${pl.refused ? '거부: ' + pl.refused : (pl.queued ? '→ 대기열' : '→ 새 턴')} ${(e.target || '').slice(0, 80)}`;
    }
    return `  [${p}] #${e.turn_id ?? '-'}${who} ${e.source === 'hook' ? 'hook:' : ''}${e.type} ${what}`.slice(0, 300);
  }
  return msg;
}

// ── 승인 대기(5단계) — 터미널 · 여기 · 시간 초과 중 먼저 온 것이 정한다 ──
const apprCards = new Map();
function apprCard(a) {
  let el = apprCards.get(a.id);
  if (!el) {
    el = document.createElement('div'); el.className = 'card'; apprCards.set(a.id, el);
    $('appr').prepend(el);
  }
  const done = a.status && a.status !== 'pending';
  el.className = 'card' + (done ? ' done' : '');
  el.innerHTML = '';
  const t = document.createElement('div');
  t.textContent = `#${a.id} [${a.project || '미분류'}] ${a.tool}${done ? ' — ' + a.status + (a.decided_by ? ' (' + a.decided_by + ')' : '') : ''}`;
  const c = document.createElement('code'); c.textContent = a.target || '';
  const m = document.createElement('div'); m.className = 'meta'; m.textContent = `이유: ${a.rule} — ${a.reason || ''}`;
  el.append(t, c, m);
  if (!done) {
    const ok = document.createElement('button'); ok.textContent = '승인';
    const no = document.createElement('button'); no.textContent = '거부';
    ok.onclick = () => decide(a.id, 'allow');
    no.onclick = () => { const why = prompt('거부 이유(모델에게 전달된다)', '사용자가 거부'); if (why !== null) decide(a.id, 'deny', why); };
    el.append(ok, no);
  } else {
    setTimeout(() => { el.remove(); apprCards.delete(a.id); countAppr(); }, 30000);
  }
  countAppr();
}
function countAppr() {
  const n = [...apprCards.values()].filter(e => !e.classList.contains('done')).length;
  $('apprCount').textContent = n ? `${n}건 대기` : '없음';
}
async function loadApprovals() {
  const r = await fetch('/api/approvals?status=pending', { headers: { 'Authorization': `Bearer ${tokenValue()}` } });
  if (!r.ok) { log(`GET /api/approvals → ${r.status}`); return; }
  for (const a of await r.json()) apprCard(a);
  countAppr();
}
async function decide(id, decision, message) {
  const r = await fetch(`/api/approvals/${id}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${tokenValue()}` },
    body: JSON.stringify({ decision, message: message || null }),
  });
  const j = await r.json().catch(() => ({}));
  log(r.ok ? `승인 #${id} → ${decision}` : `승인 #${id} 결정 실패 ${r.status} — ${j.detail || ''}`);
}

async function loadSessions() {
  const r = await fetch('/api/sessions', { headers: { 'Authorization': `Bearer ${tokenValue()}` } });
  if (!r.ok) { log(`GET /api/sessions → ${r.status}`); return; }
  const list = await r.json();
  $('sess').innerHTML = '';
  for (const x of list) {
    const o = document.createElement('option');
    o.value = x.id;
    const st = x.state === 'T' ? '정지' : (x.status || (x.pid ? '?' : '프로세스 없음'));
    o.textContent = `#${x.id} [${x.project || '미분류'}] ${(x.cc_session_id || '').slice(0, 8)} ${st}${x.tmux_pane ? ' ' + x.tmux_pane : ' tmux밖'}${x.injectable ? '' : ' (주입 불가)'}`;
    o.disabled = !x.injectable;
    $('sess').appendChild(o);
  }
  log(`세션 ${list.length}개 (주입 가능 ${list.filter(x => x.injectable).length})`);
}

async function send() {
  const id = $('sess').value, text = $('inputText').value;
  if (!id || !text) { log('세션과 입력을 고르세요'); return; }
  const r = await fetch(`/api/sessions/${id}/input`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${tokenValue()}` },
    body: JSON.stringify({ text, command: $('cmd').checked }),
  });
  const j = await r.json();
  if (r.status === 409) log(`주입 거부 — ${j.refused}`);
  else log(`주입 ${r.status} — ${j.queued ? '대기열(세션이 바쁨)' : '새 턴'}${j.guarded ? ', 첫 글자 보호' : ''}, 제출 ${j.verified ? '확인' : '확인 안 됨(입력 칸에 남았을 수 있음)'}`);
  if (r.status === 202) $('inputText').value = '';
}

async function ingest() {
  const r = await fetch('/api/ingest', { headers: { 'Authorization': `Bearer ${tokenValue()}` } });
  log(`GET /api/ingest → ${r.status} ${await r.text()}`);
}

async function emit() {
  const r = await fetch('/api/debug/emit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${tokenValue()}` },
    body: JSON.stringify({ target: $('target').value || '확인용 이벤트', payload: { from: 'index.html' } }),
  });
  log(`POST /api/debug/emit → ${r.status} ${await r.text()}`);
}

async function health() {
  const r = await fetch('/healthz');
  log(`GET /healthz → ${r.status} ${await r.text()}`);
}

$('connect').onclick = connect;
$('retryNow').onclick = () => { clearTimeout(retryTimer); clearInterval(countdown); tries = 0; open_(); };
$('emit').onclick = emit;
$('health').onclick = health;
$('ingest').onclick = ingest;
$('loadSess').onclick = loadSessions;
$('loadAppr').onclick = loadApprovals;
$('send').onclick = send;
</script>
</body>
</html>
