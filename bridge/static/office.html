<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOREMAN</title>
<link rel="stylesheet" href="/static/css/panel.css">
<style>
  :root { --bg:#111214; --fg:#e8e8ea; --muted:#9a9aa0; --line:#2e2f33; --card:#1a1b1e; --code:#202125;
          --ok:#4ade80; --bad:#f87171; --warn:#f0b445; --act:#5aa2ff; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui, -apple-system, "Noto Sans KR", sans-serif; }
  /* 글씨 크기(11-06 사용자: "전체적으로 너무 작아", 두 번) — 처음보다 대화는 +2px, 그 밖(탭 · 버튼 · 정보 줄 · 라벨 · 머리말 · 툴팁)은 +4px 안팎 */
  /* 터미널(아래 고정)이 펴지면 --term-h만큼 화면 전체가 줄어든다 — 터미널이 패널 · 캔버스를 덮지 않는다 */
  /* 바깥 스크롤은 없다(11-05) — 픽셀 화면은 줌으로 맞추고(aim) 패널 · 터미널 · 창은 각자 안에서 스크롤한다.
     vh는 가로 스크롤바 · 브라우저 막대에 따라 실제 창보다 커질 수 있어 dvh(실제 보이는 높이)를 쓴다 */
  html, body { overflow:hidden; }
  #app { display:flex; flex-direction:column; width:100%; height:calc(100dvh - var(--term-h, 0px)); min-height:0; }
  a { color:var(--act); }
  button { font:inherit; font-size:17px; padding:4px 10px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; } button.ghost { background:transparent; }
  button.small { font-size:16px; padding:2px 8px; }
  input, textarea { font:inherit; width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  /* 체크박스 · 라디오는 글자 칸이 아니다 — 넓이 100%가 걸려 버튼이 가운데로 떨어지고 글자와 떨어졌다(11-05 [+ 세션] 창) */
  input[type=checkbox], input[type=radio] { width:auto; padding:0; margin:0 6px 0 0; vertical-align:middle; flex:none; }
  label:has(> input[type=radio]), label:has(> input[type=checkbox]) { display:inline-flex; align-items:center; gap:0; cursor:pointer; }
  input[type=checkbox] { width:auto; }
  /* 머리말 두 줄(11-08) — 1줄 어디로 갈지 · 2줄 상태와 설정. 글씨 크기 배율(--ui-zoom)을 패널과 같이 받는다 */
  .otop { display:flex; flex-direction:column; gap:5px; padding:6px 14px; border-bottom:1px solid var(--line); flex:none; zoom:var(--ui-zoom); }
  .otop-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; min-width:0; }
  .otop-sub { gap:12px; font-size:16px; }
  .otop .brand { font-size:19px; }
  .ostat { color:var(--muted); white-space:nowrap; }
  .otheme { display:inline-flex; gap:3px; flex-wrap:wrap; }
  .otop a.oproj-b { color:var(--fg); text-decoration:none; font-size:15px; }
  .otop span.oproj-b.on { font-size:15px; cursor:default; }
  /* 11-05 머리말 프로젝트 줄 — 지금 방은 눌린 모양, 승인 대기(노랑 깜빡) · 안 본 새 답(파랑) 점, 숫자 */
  .oproj { display:flex; gap:3px; align-items:center; flex-wrap:wrap; }
  .oproj-b { display:inline-flex; gap:5px; align-items:center; padding:3px 9px; border:1px solid var(--line); border-radius:14px; font-size:17px; }
  .oproj-b.on { background:color-mix(in srgb, var(--act) 22%, var(--bg)); border-color:var(--act); font-weight:700; box-shadow:inset 0 1px 3px rgba(0,0,0,.3); }
  .oproj-b.pend { border-color:var(--warn); }
  .oproj-b .pn { font-size:15px; padding:0 5px; border-radius:8px; background:var(--code); color:var(--muted); font-weight:600; }
  .oproj-b .pn.warn { background:color-mix(in srgb, var(--warn) 25%, var(--bg)); color:var(--warn); }
  .pdot { display:inline-block; width:7px; height:7px; border-radius:50%; }
  .pdot.new { background:var(--act); box-shadow:0 0 0 2px color-mix(in srgb, var(--act) 30%, transparent); }
  .pdot.warn { background:var(--warn); animation:pulse 1.2s infinite; }
  .brand { font-weight:700; letter-spacing:.04em; }
  .oalerts { display:flex; gap:10px; font-size:17px; }
  .oalerts button { padding:1px 8px; }
  /* 사용량 칩(11-08) — 80% 노랑 · 95% · 못 읽음 빨강. 누르면 /usage */
  .ousage { display:inline-flex; align-items:center; padding:2px 9px; border:1px solid var(--line); border-radius:14px; font-size:16px;
            color:var(--fg); text-decoration:none; white-space:nowrap; }
  .ousage[hidden] { display:none; }
  .ousage.warn { color:var(--warn); border-color:var(--warn); } .ousage.bad { color:var(--bad); border-color:var(--bad); }
  .conn { margin-left:auto; font-size:16px; padding:2px 8px; border-radius:10px; border:1px solid var(--line); }
  .conn.up { color:var(--ok); } .conn.down, .conn.auth { color:var(--bad); border-color:var(--bad); }
  .badge { font-size:15px; padding:1px 6px; border-radius:8px; border:1px solid var(--line); white-space:nowrap; }
  .badge.st-NEED { color:#111; background:var(--warn); border-color:var(--warn); font-weight:700; }   /* 11-09 사람이 해야 풀리는 대기 */
  .st-ACTIVE { color:var(--act); } .st-IDLE { color:var(--ok); } .st-SUSPENDED { color:#9fd8ff; } .st-DORMANT { color:var(--muted); }

  /* 무대 + 옆 패널. 패널은 덮지 않고 옆에 선다 — 무대가 좁아지면 카메라가 다시 맞춘다 */
  .obody { flex:1; min-height:0; display:flex; }
  .ostage { position:relative; flex:1; min-width:0; min-height:0; overflow:hidden; }
  .ostage canvas { display:block; image-rendering:pixelated; cursor:pointer; transition:filter .3s; }
  .ostage.offline canvas { filter:grayscale(.75) brightness(.7); }
  .odown { position:absolute; left:10px; right:10px; top:10px; z-index:3; display:flex; gap:8px; align-items:center; flex-wrap:wrap;
           padding:6px 10px; border:1px solid var(--bad); border-left:5px solid var(--bad); border-radius:8px; background:#1a0f10ee; color:var(--fg); }
  .odown[hidden] { display:none; }
  .odown b { color:var(--bad); }

  .oside { --side-w:360px; position:relative; flex:none; width:var(--side-w); max-width:calc(100vw - 160px); border-left:1px solid var(--line); background:var(--bg);
           display:flex; min-height:0; }
  .oside.folded { width:34px; }
  /* 11-10 터미널은 패널 왼쪽까지만(opanel.js syncTermSide — --term-right = 패널 폭), 패널은 터미널 높이만큼 아래로 늘려 창 바닥까지.
     전에는 터미널이 펴지면 패널도 같이 줄어(1024에서 101px) 줄지 않는 입력 칸이 패널 밖으로 넘쳐 터미널 글자를 덮었다 */
  body.term-beside .oside { margin-bottom:calc(-1 * var(--term-h, 0px)); z-index:9; }
  .oside-grip { position:absolute; left:-3px; top:0; bottom:0; width:6px; cursor:pointer; z-index:2; }   /* 11-10 끌기 없음 — 두 번 눌러 좁게 ↔ 넓게 */
  .oside.folded .oside-grip { display:none; }
  .oside-strip { display:none; width:34px; border:0; border-radius:0; background:var(--card); padding:8px 0; flex-direction:column; align-items:center; gap:8px; }
  .oside.folded .oside-strip { display:flex; }
  .oside.folded .oside-main { display:none; }
  .oside-vert { writing-mode:vertical-rl; font-size:16px; color:var(--muted); letter-spacing:.2em; }
  .oside-badge { display:inline-block; min-width:20px; padding:1px 5px; border-radius:10px; background:var(--warn); color:#111; font-size:15px; font-weight:700; animation:pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity:.55; } }
  .oside-main { flex:1; min-width:0; display:flex; flex-direction:column; }
  .oside-bar { display:flex; gap:8px; align-items:center; padding:7px 10px; border-bottom:1px solid var(--line); flex:none; }
  .oside-bar b { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .oside-bar button { flex:none; white-space:nowrap; }   /* 11-06 글씨를 키우자 좁은 패널에서 "넓게"가 두 줄로 꺾였다 */
  .oside-body { flex:1; min-height:0; overflow:auto; padding:6px 12px 10px; display:flex; flex-direction:column; gap:6px; }
  .oside-body h3 { font-size:16px; margin:8px 0 2px; color:var(--muted); }
  .papprs { display:grid; grid-template-columns:minmax(0, 1fr); gap:6px; }   /* 11-10 한 줄로 자르는 줄(접힌 답 · 다른 세션)이 칸을 넓히지 않게 */
  .papprs:empty { display:none; }
  .papprs .appr { flex-direction:column; gap:4px; }
  .psel-head { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  #pSel { flex:1 0 auto; display:flex; flex-direction:column; gap:4px; }
  #pSel[hidden] { display:none; }
  /* 11-05 다시 짬 — 대화가 주인공. 제목 줄 · 한 줄 정보 · (승인 대기) · 탭 다음은 입력 칸 위까지 전부 대화 */
  .pmeta { padding:3px 10px 5px; border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:none; }
  .pmeta[hidden] { display:none; }
  .pmeta .badge { font-size:15px; }
  /* 11-10 45vh → 패널의 40% — .oside-main은 글씨 배율(zoom)을 받아 vh가 배율만큼 커졌다(1920 · 125%에서 608px, 대화 칸 30px) */
  .oside > .oside-main > .papprs { padding:6px 10px; border-bottom:1px solid var(--line); max-height:40%; overflow:auto; flex:0 1 auto; min-height:2.6em; }
  /* 낮은 창 · 큰 글씨(1024 · 125%, 150%)에서 띠(겹침 · 옮기기 · 비교)와 승인 칸이 줄지 않아 입력 칸이 패널 아래로 밀렸다 — 줄어들고 안에서 스크롤 */
  /* 띠가 먼저 준다(한 줄까지) — 이 세션이 답할 카드(has-mine)는 패널의 45% · 14em까지 지킨다(1366 · 125%에서 질문 카드가 64px 칸에 묻혔다) */
  .oside-main > .pcmp { flex:0 20 auto; min-height:1.9em; overflow:auto; }
  .oside > .oside-main > .papprs.has-mine { min-height:min(14em, 45%); }
  /* 그래도 모자라면(1366 · 125%에 질문 카드 + 띠 둘) 패널 본체가 스크롤되고 입력 칸은 패널 바닥에 붙어 늘 보인다 — 창 밖으로 밀리지 않게 */
  .oside-main { overflow-y:auto; }
  .oside .input { flex:none; position:sticky; bottom:0; background:var(--bg); z-index:1; }
  /* 이 세션이 질문의 답을 기다리는 동안 입력 칸은 한 줄 안내(opanel.js asking) — 글은 질문 카드의 글 칸으로 */
  .oside .input .pask { display:none; width:100%; text-align:left; white-space:normal; }
  .oside.asking .input .pask { display:block; }
  .oside.asking .input textarea, .oside.asking .input .prow { display:none; }
  .ptabs { display:flex; gap:2px; padding:4px 8px 0; border-bottom:1px solid var(--line); flex:none; }
  .ptabs[hidden] { display:none; }
  .ptabs button { border:0; border-bottom:3px solid transparent; border-radius:0; background:none; padding:6px 14px; color:var(--muted); font-size:19px; }   /* 11-08 17 → 19px(사용자 — 탭이 작다) */
  .ptabs button.on { color:var(--fg); border-bottom-color:var(--act); font-weight:600; }
  .ptab[hidden] { display:none; }
  .oside.tab-convo .oside-body { overflow:hidden; padding:0; }
  .ptab-convo { flex:1; min-height:0; display:flex; flex-direction:column; position:relative; }
  /* 「세션 화면」 띄우는 창(11-14, ccscreen.js) — 탭 줄 끝 단추가 연다. 패널 위에 떠 있고(모달 아님) 머리줄로 옮기고 모서리로 크기 */
  .ptabs .ptab-cc { margin-left:auto; font-size:15px; color:var(--fg); }
  .ccwin { position:fixed; z-index:40; display:flex; flex-direction:column; background:var(--bg); color:var(--fg);
           border:1px solid var(--line); border-radius:8px; box-shadow:0 10px 32px rgba(0,0,0,.45); overflow:hidden; }
  .ccwin[hidden] { display:none; }
  .ccwin-head { display:flex; align-items:center; gap:8px; padding:4px 18px 4px 18px; flex:none; cursor:move; user-select:none;
                touch-action:none; border-bottom:1px solid var(--line); background:var(--card, var(--bg)); }
  .ccwin-title { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ccwin-name { font-weight:400; color:var(--muted); margin-left:6px; }
  .ccwin-info { white-space:nowrap; margin-left:auto; }
  .ccwin-head button { cursor:pointer; flex:none; }
  .ccwin-msg { padding:6px 12px; flex:none; }
  .ccwin-msg:empty { display:none; }
  .ccwin-body { flex:1; min-height:0; background:#000; }
  .ccwin-body iframe { border:0; width:100%; height:100%; display:block; }
  .ccwin-body iframe[hidden] { display:none; }
  .ccwin-grip { position:absolute; width:16px; height:16px; touch-action:none; z-index:2; }
  .ccwin-grip[data-c="se"] { right:0; bottom:0; cursor:nwse-resize;
                background:linear-gradient(135deg, transparent 50%, var(--muted) 50% 58%, transparent 58% 70%, var(--muted) 70% 78%, transparent 78%); }
  .ccwin-grip[data-c="nw"] { left:0; top:0; cursor:nwse-resize; }
  .ccwin-grip[data-c="ne"] { right:0; top:0; cursor:nesw-resize; }
  .ccwin-grip[data-c="sw"] { left:0; bottom:0; cursor:nesw-resize; }
  .ccwin-ghost { position:fixed; z-index:41; border:2px dashed var(--act); border-radius:8px; pointer-events:none; }
  .ccwin-ghost[hidden] { display:none; }
  .oside .convo { flex:1 1 0; max-height:none; min-height:0; overflow:auto; padding:10px 12px 14px; gap:10px; scroll-behavior:auto; }
  .oside .msg { font-size:15.5px; }
  .oside.wide .msg { font-size:16px; }
  .pnew { position:absolute; left:50%; bottom:10px; transform:translateX(-50%); border-radius:14px; padding:3px 12px;
          background:var(--act); color:#fff; border:0; box-shadow:0 2px 8px rgba(0,0,0,.25); font-size:16px; }
  .pnew[hidden] { display:none; }
  .oside .feed { max-height:none; }
  .oside .input { padding:8px 12px; flex:none; }
  /* 11-10 rows=6가 정한 높이(약 9em)가 낮은 창 · 큰 글씨에서 입력 칸을 패널 밖으로 밀었다 — 높이를 CSS로 정한다(끌어서 키울 수 있다) */
  .oside .input textarea { resize:vertical; height:6.5em; min-height:2.6em; max-height:45dvh; }
  /* 입력 칸 높이 끌기(11-11) — 입력 칸 위쪽 모서리에 가는 띠. 위로 끌면 커진다. 질문 카드가 칸을 대신하는 동안은 숨긴다 */
  .oside .input .pgrip { height:10px; margin:-8px -12px 4px; cursor:ns-resize; touch-action:none; position:relative; }
  .oside .input .pgrip::after { content:''; position:absolute; left:50%; top:3px; width:34px; height:4px; margin-left:-17px; border-radius:2px; background:var(--line, #3a4356); }
  .oside .input .pgrip:hover::after, .oside .input .pgrip:focus::after, .oside .input .pgrip.drag::after { background:var(--muted, #8a93a6); }
  /* 눌러서 골랐을 때도 탭으로 짚었을 때와 같은 테두리 — 브라우저는 마우스로 준 포커스에 :focus-visible을 안 켜서 :focus로 직접 그린다(11-15) */
  .oside .input .pgrip:focus { outline:auto 1px -webkit-focus-ring-color; }
  .oside.asking .input .pgrip { display:none; }
  /* 글씨 크기(11-08, js/uiscale.js) — 패널 안쪽 전체를 한 배율로. 폭은 그대로(안쪽 글이 그만큼 접힌다) */
  .oside-main { zoom:var(--ui-zoom); }
  @media (max-height: 860px) { .oside .input textarea { height:3.6em; } }
  @media (max-height: 800px) { .oside .input textarea { height:2.6em; } }   /* 11-10 1366×768 · 150%에서 입력 칸이 20px 넘쳤다 */   /* 낮은 창 — 대화가 보이게(끌어서 키울 수 있다) */
  .ofont { display:inline-flex; align-items:center; gap:4px; }
  .ofont button { padding:1px 8px; font-weight:700; }
  .ofont button:disabled { opacity:.4; cursor:default; }
  .plist-h { margin-top:8px; }
  .plist { display:flex; gap:6px; align-items:center; width:100%; text-align:left; margin-top:4px; padding:4px 8px; }
  /* 11-15 사람이 세션을 부르는 말은 번호라 번호가 굵게(.pln), 제목은 작은 회색(.plt) — 전에는 반대 */
  .plist .plt { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:16px; color:var(--muted); }
  .plist .pln { flex:none; white-space:nowrap; font-weight:600; }
  details > summary { cursor:pointer; }

  /* 휴대폰 — 패널은 아래 판(접으면 막대 한 줄). 캔버스는 위에 남는다 */
  @media (max-width: 760px) {
    .otop { gap:4px; padding:6px 10px; } .otheme { order:9; width:100%; }
    .obody { flex-direction:column; }
    .oside { width:auto !important; height:40vh; border-left:0; border-top:1px solid var(--line); }
    .oside.folded { height:34px; }
    .oside-grip { display:none; }
    .oside-strip { width:100%; height:34px; flex-direction:row; justify-content:center; padding:0; }
    .oside-strip > span:first-child { transform:rotate(90deg); }
    .oside-vert { writing-mode:horizontal-tb; }
  }
</style>
</head>
<body>
<div id="app"></div>
<noscript>이 화면은 자바스크립트가 필요하다.</noscript>
<script type="module">
  // 10단계 픽셀 화면(10b부터 /). 데이터는 6단계 store.js 그대로 — 그리기는 office.js(테마는 themes/<이름>/theme.json), 옆 패널은 opanel.js
  import { Store } from '/static/js/store.js';
  import { createOffice } from '/static/js/office.js';
  import { createTerminal } from '/static/js/terminal.js';
  import '/static/js/uiscale.js';       // 글씨 크기 [가−] [가+](11-08) — 패널 · 터미널
  import '/static/js/foremanchat.js';   // [+ 세션] 창 위의 "디스패처(팀장 · 교장 · 소장)에게 말하기"(11단계 · 11-08)
  const store = new Store();
  window.foreman = store;
  // 테마: ?theme= 가 있으면 그것(그리고 기억), 없으면 마지막에 본 것, 그것도 없으면 오피스
  const THEMES = ['office', 'magic', 'site', 'plain'];
  let saved = null;
  try { saved = localStorage.getItem('foremanTheme'); } catch { /* 기억 못 해도 된다 */ }
  const asked = new URLSearchParams(location.search).get('theme');
  const theme = THEMES.includes(asked) ? asked : THEMES.includes(saved) ? saved : 'office';
  try { localStorage.setItem('foremanTheme', theme); } catch { /* 위와 같다 */ }
  createOffice(document.getElementById('app'), store, `/static/themes/${theme}/theme.json`)
    .then(async (o) => {
      window.office = o;
      const demo = new URLSearchParams(location.search).get('demo');   // 시연 재생(13) — 실제 연결을 열지 않는다
      if (demo) { const { runDemo } = await import('/static/js/demo.js'); return runDemo(store, demo); }
      if (store.token) store.start();
      else document.getElementById('tokDlg').classList.add('on');
      // 텔레그램의 자동 제안 링크(11-08) — /?dispatch=N이면 그 계획을 말하기 창에 연다
      const dn = Number(new URLSearchParams(location.search).get('dispatch'));
      if (dn > 0 && store.token && window.foremanChat) setTimeout(() => window.foremanChat.openDispatch(dn), 800);
    })
    .catch((err) => { document.getElementById('app').textContent = '픽셀 화면을 띄우지 못했다: ' + err; console.error(err); });
  // 7단계 터미널 — 아래 접이식. 깨져도 픽셀 화면은 돈다
  // 열 때 지금 보는 현장의 프로젝트 터미널(11-10)
  try { createTerminal(store, { getProject: () => (window.office && window.office.currentProject ? window.office.currentProject() : null) }); }
  catch (err) { console.error('터미널 패널 실패', err); }
</script>
</body>
</html>
